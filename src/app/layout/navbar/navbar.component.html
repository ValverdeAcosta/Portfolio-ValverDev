<nav class="navbar" [class.scrolled]="isScrolled()">
  <button type="button" class="nav-logo" (click)="scrollTo('hero')" aria-label="Ir al inicio">Valver<span>.</span>dev</button>

  <div class="nav-right">
    <ul class="nav-links">
      @for (item of navItems; track item.sectionId) {
        <li>
          <a [href]="'#' + item.sectionId" (click)="$event.preventDefault(); scrollTo(item.sectionId)">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="theme-toggle" aria-label="Selector de tema">
      <button
        type="button"
        class="theme-button"
        [class.active]="!themeService.isDark()"
        (click)="themeService.setTheme('light')"
        aria-label="Activar tema claro"
        title="Tema claro"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
      </button>
      <button
        type="button"
        class="theme-button"
        [class.active]="themeService.isDark()"
        (click)="themeService.setTheme('dark')"
        aria-label="Activar tema oscuro"
        title="Tema oscuro"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8z"></path>
        </svg>
      </button>
    </div>
  </div>
</nav>
